# Timeweb Cloud Apps — deploy manifest.
#
# nginx :80 + socat :8080/:3111 -> agentmemory 127.0.0.1:8080 (no double-bind on 8080)
# First ports: entry is 8080:8080 — Timeweb often routes the domain to that container port.
# Also publish 80 for platforms that route to container :80.
#
# Panel: try container port 8080 first, then 80. Health: /agentmemory/livez
# Test: curl http://<app>.twc1.net/agentmemory/livez
#
# Local: docker compose -f docker-compose.yml -f docker-compose.local.yml up --build
version: "3.9"

services:
  agentmemory:
    build:
      context: ./deploy/timeweb
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
      - "8081:80"
    environment:
      ENABLE_NGINX_PROXY: "true"
      III_REST_PORT: "8080"
      III_STREAMS_PORT: "8081"
      ENABLE_PORT_COMPAT: "true"
      APP_PUBLIC_URL: "${APP_PUBLIC_URL:-}"
      ENABLE_BACKUPS: "${ENABLE_BACKUPS:-false}"
      ENABLE_AUTO_RESTORE: "${ENABLE_AUTO_RESTORE:-true}"
      AWS_S3_BUCKET: "${AWS_S3_BUCKET:-}"
      AWS_ACCESS_KEY_ID: "${AWS_ACCESS_KEY_ID:-}"
      AWS_SECRET_ACCESS_KEY: "${AWS_SECRET_ACCESS_KEY:-}"
      AWS_ENDPOINT_URL: "${AWS_ENDPOINT_URL:-https://s3.twcstorage.ru}"
      AWS_REGION: "${AWS_REGION:-ru-1}"
      AWS_S3_PREFIX: "${AWS_S3_PREFIX:-agentmemory-backups}"
      BACKUP_KEEP_COUNT: "${BACKUP_KEEP_COUNT:-7}"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:8080/agentmemory/livez"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s
