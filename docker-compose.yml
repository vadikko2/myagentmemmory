# Timeweb Cloud Apps — deploy manifest.
#
# Routing: domain :80/:443 -> Timeweb edge -> container :80 (nginx) -> agentmemory :8080
# Do NOT map "8080:8080" — it reserves :8080 and breaks socat/nginx.
#
# compose "8080:80" = local test only (host 8080 -> container nginx :80)
# Panel: container port 80, health /agentmemory/livez, Storage /data
#
# Local direct: docker compose -f docker-compose.yml -f docker-compose.local.yml up --build
version: "3.9"

services:
  agentmemory:
    build:
      context: ./deploy/timeweb
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    environment:
      ENABLE_NGINX_PROXY: "true"
      III_REST_PORT: "8080"
      III_STREAMS_PORT: "8081"
      ENABLE_PORT_COMPAT: "true"
      APP_PUBLIC_URL: "${APP_PUBLIC_URL:-}"
      ENABLE_BACKUPS: "${ENABLE_BACKUPS:-false}"
      ENABLE_AUTO_RESTORE: "${ENABLE_AUTO_RESTORE:-true}"
      AWS_S3_BUCKET: "${AWS_S3_BUCKET:-}"
      AWS_ACCESS_KEY_ID: "${AWS_ACCESS_KEY_ID:-}"
      AWS_SECRET_ACCESS_KEY: "${AWS_SECRET_ACCESS_KEY:-}"
      AWS_ENDPOINT_URL: "${AWS_ENDPOINT_URL:-https://s3.twcstorage.ru}"
      AWS_REGION: "${AWS_REGION:-ru-1}"
      AWS_S3_PREFIX: "${AWS_S3_PREFIX:-agentmemory-backups}"
      BACKUP_KEEP_COUNT: "${BACKUP_KEEP_COUNT:-7}"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:80/agentmemory/livez"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s
