# Local dev: agentmemory on 3111 (no nginx).
services:
  agentmemory:
    ports:
      - "3111:3111"
    environment:
      ENABLE_NGINX_PROXY: "false"
      ENABLE_PORT_COMPAT: "false"
      PORT: "3111"
      III_REST_PORT: "3111"
      III_STREAMS_PORT: "3112"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:3111/agentmemory/livez"]
      start_period: 60s
    volumes:
      - ./.data:/data
    restart: unless-stopped
